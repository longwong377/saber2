<script type="module">
import * as THREE from '/vendor/three/three.module.js';
import { COMPANION_UNITS } from '/src/game/CompanionKinds.js';
import { ARCHETYPES } from '/src/game/Enemy.js';
import '/src/game/Levels.js';
