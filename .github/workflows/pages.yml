# Publishes the repository as a playable static site.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# GitHub's default workflow token is not allowed to create a Pages site that
# does not exist yet, so the first run fails until that switch is flipped.
# After that, every push publishes automatically.
name: Deploy SABER to Pages

on:
  push:
    # ONLY THE DEFAULT BRANCH, AND THE LIST USED TO BE LONGER.
    #
    # Pages deploys the default branch and refuses every other one, so a feature
    # branch in this list buys nothing — but it does not cost nothing either.
    # Every run here takes the `pages` concurrency group below with
    # `cancel-in-progress: true`, so a push to a feature branch STARTS A RUN
    # THAT CANCELS AN IN-FLIGHT DEPLOY OF THE DEFAULT BRANCH and then fails on
    # its own account seconds later. Three of those fired in the twenty minutes
    # after a good deploy and the site was left stuck on its loading screen.
    #
    # A branch that cannot be published must not be able to interrupt the one
    # that can.
    branches: ['main', 'master', 'claude/lightsaber-combat-game-lxw391']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-check the tree
        # A stray symlink (e.g. a local node_modules) makes tar --dereference
        # fail with "File removed before we read it", which is a confusing way
        # to learn something got committed by accident.
        run: |
          broken=$(find . -path ./.git -prune -o -xtype l -print)
          if [ -n "$broken" ]; then
            echo "::error::dangling symlinks in the tree:"; echo "$broken"; exit 1
          fi
          test -f index.html
      - uses: actions/configure-pages@v5
        with:
          # create the Pages site on first run so no manual switch is needed
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the repository is the site; there is nothing to build
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
