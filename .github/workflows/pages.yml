# Publishes the repository as a playable static site.
# Enable with: Settings → Pages → Source: GitHub Actions
name: Deploy SABER to Pages

on:
  push:
    branches: ['main', 'master', 'claude/lightsaber-combat-game-lxw391']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # create the Pages site on first run so no manual switch is needed
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the repository is the site; there is nothing to build
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
